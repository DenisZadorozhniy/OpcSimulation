name: Automation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      OPC_UA_ENDPOINT: opc.tcp://localhost:50000
      OPC_UA_SECURITY_ENDPOINT: opc.tcp://localhost:50002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start OPC PLC simulator
        run: >-
          docker run -d --rm -p 50000:50000 -p 8080:8080 --name opcplc-ci
          mcr.microsoft.com/iotedge/opc-plc:latest
          --pn=50000 --autoaccept --unsecuretransport --sn=5 --sr=10 --fn=5 --fr=1
      - name: Wait for an OPC UA session and live node
        run: node out-tsc/scripts/waitForOpcUa.js
      - name: Start secured OPC PLC simulator
        run: >-
          docker run -d --rm -p 50002:50002 --name opcplc-security-ci
          mcr.microsoft.com/iotedge/opc-plc:latest
          --pn=50002 --autoaccept --sn=5 --sr=10 --fn=5 --fr=1
      - name: Wait for secured endpoint discovery
        run: node out-tsc/scripts/waitForOpcUaSecurity.js
      - run: npm test
      - name: Simulator logs
        if: always()
        run: docker logs opcplc-ci || true
      - name: Security simulator logs
        if: always()
        run: docker logs opcplc-security-ci || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            !test-results/**/*-pki/**
            tmp/device-receipts.json
          retention-days: 14
